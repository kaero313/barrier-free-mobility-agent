[project]
name = "barrier-free-mobility-agent"
version = "0.1.0"
description = "A production-oriented AI agent for barrier-free mobility MCP tools."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.139.0,<0.140.0",
    "httpx>=0.28.1,<0.29.0",
    "langchain>=1.3.12,<1.4.0",
    "langchain-mcp-adapters>=0.3.0,<0.4.0",
    "langgraph>=1.2.9,<1.3.0",
    "langgraph-checkpoint-postgres>=3.1.0,<3.2.0",
    "mcp>=1.27.0,<2.0.0",
    "openai>=2.45.0,<2.46.0",
    "psycopg[binary,pool]>=3.3.4,<3.4.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pycryptodome>=3.23.0,<4.0.0",
    "uvicorn[standard]>=0.40.0,<0.41.0",
]

[project.scripts]
mobility-agent = "barrier_free_mobility_agent.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2.0.0",
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "respx>=0.22.0,<1.0.0",
    "ruff>=0.14.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/barrier_free_mobility_agent"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/barrier_free_mobility_agent",
    "/pyproject.toml",
    "/README.md",
    "/uv.lock",
]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "contract: tests against a running Barrier-Free Mobility MCP server",
]

[tool.coverage.run]
branch = true
source = ["barrier_free_mobility_agent"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "F",
    "I",
    "LOG",
    "PIE",
    "PT",
    "RET",
    "RUF",
    "SIM",
    "UP",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
